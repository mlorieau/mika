<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur d'Avatars — Demo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  min-height: 100vh;
}

header {
  background: rgba(255,255,255,.03);
  border-bottom: 1px solid rgba(255,255,255,.07);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  gap: 12px;
}
header h1 { font-size: 1rem; font-weight: 700; }
.badge {
  font-size: .62rem; font-weight: 800; letter-spacing: .12em;
  text-transform: uppercase; padding: 3px 10px; border-radius: 99px;
  background: rgba(201,150,42,.15); color: #c9962a;
  border: 1px solid rgba(201,150,42,.28);
}

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 40px 20px 80px;
}

.hero {
  text-align: center;
  margin-bottom: 40px;
}
.hero h2 {
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 900;
  background: linear-gradient(135deg, #fff 40%, rgba(255,255,255,.45));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.hero p { font-size: .9rem; color: rgba(255,255,255,.38); }

/* ── Generator card ── */
.gen-card {
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  padding: 28px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 32px;
  align-items: start;
  margin-bottom: 44px;
}

.preview-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

#mainCanvas {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  display: block;
  box-shadow:
    0 0 0 3px rgba(255,255,255,.1),
    0 24px 64px rgba(0,0,0,.55),
    0 4px 16px rgba(0,0,0,.3);
}

.controls { display: flex; flex-direction: column; gap: 18px; }

.field label {
  display: block;
  font-size: .68rem;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.35);
  margin-bottom: 8px;
}
.input-row { display: flex; gap: 8px; }

input[type=text] {
  flex: 1;
  background: rgba(255,255,255,.06);
  border: 1.5px solid rgba(255,255,255,.1);
  border-radius: 10px;
  padding: 11px 15px;
  color: #e6edf3;
  font-size: .9rem;
  font-family: inherit;
  outline: none;
  transition: border-color .18s;
}
input[type=text]:focus { border-color: rgba(255,255,255,.28); }

.btn {
  padding: 11px 18px;
  border-radius: 10px;
  border: none;
  font-family: inherit;
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .18s, transform .1s;
  white-space: nowrap;
}
.btn:hover { opacity: .85; }
.btn:active { transform: scale(.96); }
.btn-violet { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
.btn-ghost  { background: rgba(255,255,255,.07); color: #e6edf3; border: 1px solid rgba(255,255,255,.1); }
.btn-gold   { background: linear-gradient(135deg, #c9962a, #f39c12); color: #fff; width: 100%; }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Variants */
#variantArea { display: none; }
#variantArea label {
  font-size: .68rem; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: rgba(255,255,255,.35);
  display: block; margin-bottom: 10px;
}
#variantGrid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
#variantGrid canvas {
  width: 100%; border-radius: 50%; cursor: pointer; display: block;
  box-shadow: 0 3px 10px rgba(0,0,0,.4);
  transition: transform .2s, box-shadow .2s;
}
#variantGrid canvas:hover {
  transform: scale(1.1);
  box-shadow: 0 6px 18px rgba(0,0,0,.5);
}

/* ── Gallery ── */
.gal-head {
  font-size: .68rem; font-weight: 800; letter-spacing: .12em;
  text-transform: uppercase; color: rgba(255,255,255,.3);
  margin-bottom: 18px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
  gap: 16px;
}
.gal-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 7px; cursor: pointer;
}
.gal-item canvas {
  width: 76px; height: 76px; border-radius: 50%; display: block;
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
  transition: transform .2s, box-shadow .2s;
}
.gal-item:hover canvas {
  transform: scale(1.1) translateY(-2px);
  box-shadow: 0 10px 28px rgba(0,0,0,.5);
}
.gal-name {
  font-size: .64rem; color: rgba(255,255,255,.3);
  text-align: center; max-width: 76px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

@media (max-width: 620px) {
  .gen-card { grid-template-columns: 1fr; }
  .preview-col { flex-direction: row; }
  #mainCanvas { width: 130px; height: 130px; }
}
</style>
</head>
<body>

<header>
  <span style="font-size:1.3rem">🎭</span>
  <h1>Avatar Generator</h1>
  <span class="badge">Procédural · Seedé</span>
</header>

<div class="wrap">
  <div class="hero">
    <h2>Chaque pseudo, un avatar unique</h2>
    <p>Déterministe — le même pseudo génère toujours le même avatar</p>
  </div>

  <div class="gen-card">
    <div class="preview-col">
      <canvas id="mainCanvas" width="300" height="300"></canvas>
      <button class="btn btn-gold" onclick="dlAvatar()">⬇ Télécharger PNG</button>
    </div>

    <div class="controls">
      <div class="field">
        <label>Pseudo / identifiant</label>
        <div class="input-row">
          <input type="text" id="seed" value="Zone85" placeholder="Ex : JeanPierre…">
          <button class="btn btn-violet" onclick="genFrom()">Générer</button>
        </div>
      </div>

      <div class="field">
        <label>Actions</label>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="randomize()">🎲 Aléatoire</button>
          <button class="btn btn-ghost" onclick="showVariants()">✨ Variantes</button>
        </div>
      </div>

      <div id="variantArea">
        <label>Variantes (cliquez pour sélectionner)</label>
        <div id="variantGrid"></div>
      </div>
    </div>
  </div>

  <div class="gal-head">Galerie d'exemples — cliquez pour charger</div>
  <div class="gallery" id="gallery"></div>
</div>

<script>
/* ─── SEEDED RNG (xorshift32 + FNV hash) ─────────────────── */
function mkRng(s) {
  s = (s >>> 0) || 1;
  return () => {
    s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
    return (s >>> 0) / 0xFFFFFFFF;
  };
}
function hash(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

/* ─── PALETTES ────────────────────────────────────────────── */
const BG = [
  ['#667eea','#764ba2'],['#f093fb','#f5576c'],['#4facfe','#00f2fe'],
  ['#43e97b','#38f9d7'],['#fa709a','#fee140'],['#a18cd1','#fbc2eb'],
  ['#fc5c7d','#6a82fb'],['#a1c4fd','#c2e9fb'],['#d4fc79','#96e6a1'],
  ['#89f7fe','#66a6ff'],['#f6d365','#fda085'],['#30cfd0','#663399'],
  ['#a8edea','#fed6e3'],['#5f72bd','#9b23ea'],['#0fd850','#f9f047'],
  ['#fccb90','#d57eeb'],['#e0c3fc','#8ec5fc'],['#f7971e','#ffd200'],
  ['#1a1a2e','#e94560'],['#2c3e50','#4ca1af'],
];
const SKIN  = ['#FDDBB4','#F4C2A0','#E8A87C','#D4956A','#C68642','#8D5524'];
const HAIR  = ['#1A1A1A','#2C1810','#5C3D2E','#8B5E3C','#C4813B','#D4A044','#E8C89D','#8B8B8B','#C0C0C0','#C0392B','#9B59B6','#2980B9'];
const EYES  = ['#2980B9','#27AE60','#8E44AD','#D35400','#2C3E50','#16A085','#C0392B','#7F8C8D'];

/* ─── COLOR UTILS ─────────────────────────────────────────── */
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const rgb2hex = (r,g,b) => '#'+[r,g,b].map(v=>Math.min(255,Math.max(0,v|0)).toString(16).padStart(2,'0')).join('');
const darken  = (h, a) => { const [r,g,b]=hex2rgb(h); return rgb2hex(r*(1-a),g*(1-a),b*(1-a)); };
const al      = (h, a) => { const [r,g,b]=hex2rgb(h); return `rgba(${r},${g},${b},${a})`; };

/* ─── HAIR — BACK LAYER ───────────────────────────────────── */
function hairBack(ctx, cx, cy, r, style, col) {
  ctx.fillStyle = col;
  ctx.save();

  if (style === 0) { // Buzz
    ctx.beginPath();
    ctx.arc(cx, cy - r*.08, r*1.02, Math.PI*1.02, Math.PI*1.98);
    ctx.lineTo(cx, cy - r*.08);
    ctx.closePath(); ctx.fill();

  } else if (style === 1) { // Classic
    ctx.beginPath();
    ctx.arc(cx, cy, r+r*.06, Math.PI*.95, Math.PI*2.05);
    ctx.lineTo(cx, cy); ctx.closePath(); ctx.fill();

  } else if (style === 2) { // Wavy medium
    ctx.beginPath();
    ctx.arc(cx, cy, r+r*.1, Math.PI*.88, Math.PI*2.12);
    ctx.bezierCurveTo(cx+r*1.25, cy+r*.85, cx-r*1.25, cy+r*.55, cx, cy);
    ctx.closePath(); ctx.fill();

  } else if (style === 3) { // Long straight
    ctx.beginPath();
    ctx.moveTo(cx-r*1.06, cy-r*.28);
    ctx.lineTo(cx-r*1.18, cy+r*1.25);
    ctx.lineTo(cx-r*.55, cy+r*1.45);
    ctx.arc(cx, cy, r+r*.09, Math.PI*.92, Math.PI*2.08);
    ctx.lineTo(cx+r*.55, cy+r*1.45);
    ctx.lineTo(cx+r*1.18, cy+r*1.25);
    ctx.lineTo(cx+r*1.06, cy-r*.28);
    ctx.closePath(); ctx.fill();

  } else if (style === 4) { // Curly
    for (let a = Math.PI*.92; a <= Math.PI*1.98; a += .24) {
      ctx.beginPath();
      ctx.arc(cx+Math.cos(a)*r*1.04, cy+Math.sin(a)*r*1.04, r*.15, 0, Math.PI*2);
      ctx.fill();
    }

  } else { // Afro
    ctx.beginPath();
    ctx.arc(cx, cy-r*.1, r*1.42, Math.PI*.82, Math.PI*2.18);
    ctx.lineTo(cx, cy); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ─── HAIR — FRONT LAYER ──────────────────────────────────── */
function hairFront(ctx, cx, cy, r, style, col) {
  ctx.fillStyle = col;
  ctx.save();

  if (style === 0) { // Buzz — thin strip
    ctx.beginPath();
    ctx.ellipse(cx, cy-r*.9, r*.94, r*.17, 0, 0, Math.PI*2);
    ctx.fill();

  } else if (style === 1) { // Classic — side sweep
    ctx.beginPath();
    ctx.moveTo(cx-r*1.0, cy-r*.48);
    ctx.bezierCurveTo(cx-r*.65, cy-r*1.12, cx+r*.22, cy-r*1.18, cx+r*.92, cy-r*.58);
    ctx.bezierCurveTo(cx+r*.5, cy-r*.76, cx-r*.08, cy-r*.72, cx-r*.68, cy-r*.34);
    ctx.closePath(); ctx.fill();

  } else if (style === 2) { // Wavy — center part
    ctx.beginPath();
    ctx.moveTo(cx-r*.92, cy-r*.68);
    ctx.bezierCurveTo(cx-r*.6, cy-r*1.12, cx-r*.08, cy-r*1.14, cx, cy-r*1.12);
    ctx.bezierCurveTo(cx+r*.08, cy-r*1.14, cx+r*.6, cy-r*1.12, cx+r*.92, cy-r*.68);
    ctx.bezierCurveTo(cx+r*.5, cy-r*.78, cx, cy-r*.76, cx-r*.5, cy-r*.78);
    ctx.closePath(); ctx.fill();

  } else if (style === 3) { // Long — full bangs
    ctx.beginPath();
    ctx.moveTo(cx-r*1.04, cy-r*.52);
    ctx.bezierCurveTo(cx-r*.75, cy-r*1.12, cx-r*.18, cy-r*1.16, cx, cy-r*1.12);
    ctx.bezierCurveTo(cx+r*.18, cy-r*1.16, cx+r*.75, cy-r*1.12, cx+r*1.04, cy-r*.52);
    ctx.bezierCurveTo(cx+r*.68, cy-r*.7, cx, cy-r*.62, cx-r*.68, cy-r*.7);
    ctx.closePath(); ctx.fill();

  } else if (style === 4) { // Curly — top clusters
    for (let i=0;i<5;i++) {
      const a = -Math.PI*.82 + i*(Math.PI*.82/4);
      ctx.beginPath();
      ctx.arc(cx+Math.cos(a)*r*.95, cy+Math.sin(a)*r*.95, r*.17, 0, Math.PI*2);
      ctx.fill();
    }

  } else { // Afro top puffs
    for (let i=0;i<7;i++) {
      const a = -Math.PI*.88 + i*(Math.PI*.88/6);
      ctx.beginPath();
      ctx.arc(cx+Math.cos(a)*r*1.3, cy+Math.sin(a)*r*1.3, r*.24, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ─── MAIN DRAW ───────────────────────────────────────────── */
function draw(canvas, seed) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;

  const s = typeof seed === 'string' ? hash(seed) : (seed >>> 0);
  const rng = mkRng(s);
  const rn = rng;
  const pick = a => a[Math.floor(rn()*a.length)];
  const ri = (a,b) => a + Math.floor(rn()*(b-a+1));

  ctx.clearRect(0,0,W,H);

  // ── Clip ──
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,W/2-1,0,Math.PI*2);
  ctx.clip();

  // ── Background ──
  const [c1,c2] = BG[Math.floor(rn()*BG.length)];
  const ang = rn()*Math.PI*2;
  const grd = ctx.createLinearGradient(
    cx+Math.cos(ang)*W*.7, cy+Math.sin(ang)*H*.7,
    cx-Math.cos(ang)*W*.7, cy-Math.sin(ang)*H*.7
  );
  grd.addColorStop(0,c1); grd.addColorStop(1,c2);
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,W,H);

  // Depth circles
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.beginPath(); ctx.arc(W*.22,H*.2,W*.52,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.07)';
  ctx.beginPath(); ctx.arc(W*.82,H*.85,W*.58,0,Math.PI*2); ctx.fill();

  // ── Features ──
  const skin      = SKIN[ri(0,SKIN.length-1)];
  const hairCol   = HAIR[ri(0,HAIR.length-1)];
  const eyeCol    = pick(EYES);
  const hairStyle = ri(0,5);
  const glasses   = rn() < .24;
  const mouth     = ri(0,2);

  const hr = W*.234; // head radius
  const hcy = cy - H*.048; // head center Y (slightly above mid)

  // ── Shoulders ──
  const shirtCol = al(darken(c1,.35),.88);
  ctx.fillStyle = shirtCol;
  ctx.beginPath();
  ctx.moveTo(0,H+2);
  ctx.lineTo(cx-W*.38, H*.72);
  ctx.bezierCurveTo(cx-W*.28,H*.64, cx-W*.14,H*.61, cx,H*.61);
  ctx.bezierCurveTo(cx+W*.14,H*.61, cx+W*.28,H*.64, cx+W*.38,H*.72);
  ctx.lineTo(W,H+2);
  ctx.closePath(); ctx.fill();

  // ── Neck ──
  const nw = hr*.42;
  ctx.fillStyle = skin;
  ctx.fillRect(cx-nw/2, hcy+hr*.72, nw, H*.12);

  // ── Hair back ──
  hairBack(ctx, cx, hcy, hr, hairStyle, hairCol);

  // ── Ears ──
  ctx.fillStyle = skin;
  ctx.strokeStyle = darken(skin,.13);
  ctx.lineWidth = 1.5;
  [[-1,1],[1,1]].forEach(([dx]) => {
    ctx.beginPath();
    ctx.ellipse(cx+dx*hr*.9, hcy+hr*.05, hr*.115, hr*.19, dx*-.15, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  });

  // ── Head shadow ──
  ctx.fillStyle = 'rgba(0,0,0,.09)';
  ctx.beginPath();
  ctx.arc(cx+hr*.05, hcy+hr*.09, hr, 0, Math.PI*2);
  ctx.fill();

  // ── Head ──
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(cx,hcy,hr,0,Math.PI*2); ctx.fill();

  // Face sheen
  const fg = ctx.createRadialGradient(cx-hr*.3,hcy-hr*.38,hr*.04, cx,hcy,hr);
  fg.addColorStop(0,'rgba(255,255,255,.2)');
  fg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(cx,hcy,hr,0,Math.PI*2); ctx.fill();

  // ── Eyebrows ──
  const browCol = hairCol === '#E8C89D' || hairCol === '#C0C0C0'
    ? darken(hairCol,.45) : darken(hairCol,.1);
  ctx.strokeStyle = browCol;
  ctx.lineWidth = hr*.068;
  ctx.lineCap = 'round';
  const bY = hcy-hr*.28;
  [[-1,1],[1,-1]].forEach(([s,d]) => {
    ctx.beginPath();
    ctx.moveTo(cx+s*hr*.44, bY+hr*.04);
    ctx.quadraticCurveTo(cx+s*hr*.24, bY-hr*.07, cx+s*hr*.07, bY+hr*.02);
    ctx.stroke();
  });

  // ── Eyes ──
  const eY = hcy-hr*.06;
  const eX = hr*.28;
  const eRx = hr*.144, eRy = hr*.118;

  ctx.fillStyle = '#FAFAFA';
  [-1,1].forEach(d => {
    ctx.beginPath();
    ctx.ellipse(cx+d*eX, eY, eRx, eRy, 0, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.fillStyle = eyeCol;
  [-1,1].forEach(d => {
    ctx.beginPath();
    ctx.arc(cx+d*eX, eY, eRy*.74, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#111';
  [-1,1].forEach(d => {
    ctx.beginPath();
    ctx.arc(cx+d*eX, eY, eRy*.42, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = 'rgba(255,255,255,.78)';
  [-1,1].forEach(d => {
    ctx.beginPath();
    ctx.arc(cx+d*eX+eRy*.22, eY-eRy*.27, eRy*.2, 0, Math.PI*2); ctx.fill();
  });

  // ── Nose ──
  ctx.strokeStyle = darken(skin,.23);
  ctx.lineWidth = hr*.042;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx-hr*.07, hcy+hr*.13);
  ctx.quadraticCurveTo(cx-hr*.12, hcy+hr*.27, cx, hcy+hr*.27);
  ctx.quadraticCurveTo(cx+hr*.12, hcy+hr*.27, cx+hr*.07, hcy+hr*.13);
  ctx.stroke();

  // ── Mouth ──
  ctx.strokeStyle = darken(skin,.4);
  ctx.lineWidth = hr*.065;
  ctx.lineCap = 'round';
  const mY = hcy+hr*.47;
  if (mouth===0) {
    ctx.beginPath();
    ctx.moveTo(cx-hr*.22, mY-hr*.05);
    ctx.quadraticCurveTo(cx, mY+hr*.11, cx+hr*.22, mY-hr*.05);
    ctx.stroke();
  } else if (mouth===1) {
    ctx.beginPath();
    ctx.moveTo(cx-hr*.17, mY); ctx.lineTo(cx+hr*.17, mY);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx-hr*.16, mY);
    ctx.quadraticCurveTo(cx+hr*.05, mY+hr*.07, cx+hr*.2, mY-hr*.07);
    ctx.stroke();
  }

  // ── Hair front ──
  hairFront(ctx, cx, hcy, hr, hairStyle, hairCol);

  // ── Glasses ──
  if (glasses) {
    const gc = pick(['#1a1a2e','#c0392b','#2980b9','#f39c12','#8e44ad','#27ae60','#2c3e50']);
    ctx.strokeStyle = gc;
    ctx.lineWidth = hr*.054;
    ctx.lineCap = 'round';
    const gr = eRx*1.3;
    [-1,1].forEach(d => {
      ctx.beginPath(); ctx.arc(cx+d*eX, eY, gr, 0, Math.PI*2); ctx.stroke();
    });
    ctx.beginPath(); ctx.moveTo(cx-eX+gr, eY); ctx.lineTo(cx+eX-gr, eY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-eX-gr, eY); ctx.lineTo(cx-hr, eY+hr*.04); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+eX+gr, eY); ctx.lineTo(cx+hr, eY+hr*.04); ctx.stroke();
  }

  // ── Ring border ──
  ctx.strokeStyle = 'rgba(255,255,255,.13)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx,cy,W/2-2,0,Math.PI*2); ctx.stroke();

  ctx.restore();
}

/* ─── UI ──────────────────────────────────────────────────── */
let cur = 'Zone85';

function genFrom() {
  const v = document.getElementById('seed').value.trim() || 'Zone85';
  cur = v;
  draw(document.getElementById('mainCanvas'), v);
  document.getElementById('variantArea').style.display = 'none';
}

function randomize() {
  const s = Math.floor(Math.random() * 0xFFFFFF);
  cur = s;
  document.getElementById('seed').value = '#' + s.toString(16).padStart(6,'0').toUpperCase();
  draw(document.getElementById('mainCanvas'), s);
  document.getElementById('variantArea').style.display = 'none';
}

function showVariants() {
  const area = document.getElementById('variantArea');
  const grid = document.getElementById('variantGrid');
  area.style.display = 'block';
  grid.innerHTML = '';
  const base = typeof cur === 'string' ? hash(cur) : cur;
  for (let i=0; i<10; i++) {
    const s = (base + i*7919) >>> 0;
    const c = document.createElement('canvas');
    c.width = c.height = 80;
    draw(c, s);
    c.onclick = () => {
      cur = s;
      draw(document.getElementById('mainCanvas'), s);
    };
    grid.appendChild(c);
  }
}

function dlAvatar() {
  const c = document.getElementById('mainCanvas');
  // HD export at 2x
  const hd = document.createElement('canvas');
  hd.width = hd.height = 600;
  draw(hd, cur);
  const a = document.createElement('a');
  a.download = 'avatar.png';
  a.href = hd.toDataURL('image/png');
  a.click();
}

/* ─── GALLERY ─────────────────────────────────────────────── */
const NAMES = [
  'Zone85','Michel_V','Benoît_B','Laure42','@rando85',
  'Jean-Pierre','MarieFrance','Bocage','Littoral','Zonaute',
  'Vendée3','La Roche','Clisson','Noirmoutier','Fontenay',
  'Herbiers','Challans','StGilles','Talmont','Maillezais'
];

(function buildGallery() {
  const g = document.getElementById('gallery');
  NAMES.forEach(name => {
    const wrap = document.createElement('div');
    wrap.className = 'gal-item';

    const c = document.createElement('canvas');
    c.width = c.height = 120;
    draw(c, name);

    const lbl = document.createElement('div');
    lbl.className = 'gal-name';
    lbl.textContent = name;

    wrap.appendChild(c);
    wrap.appendChild(lbl);
    wrap.onclick = () => {
      cur = name;
      document.getElementById('seed').value = name;
      draw(document.getElementById('mainCanvas'), name);
      document.getElementById('variantArea').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    g.appendChild(wrap);
  });
})();

/* ─── INIT ───────────────────────────────────────────────── */
draw(document.getElementById('mainCanvas'), 'Zone85');
document.getElementById('seed').addEventListener('keydown', e => {
  if (e.key === 'Enter') genFrom();
});
